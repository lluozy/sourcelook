name: release

# **只在手动触发时**运行：构建 → 语法/冒烟检查 → 打安装包 → 建 release。
#
# 刻意不挂 `push: tags`：发版时机由作者决定（自己满意了才发），
# 推 tag / 推代码都不该自动对外发布。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 v1.6.0）。留空 = 只构建并留产物，不建 release'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build client bundle
        run: node scripts/build.mjs

      - name: Syntax check
        run: node --check client.js

      - name: Smoke tests
        run: |
          node scripts/smoke-host.mjs
          node scripts/smoke-index.cjs

      - name: Package install bundle
        run: |
          set -eu
          REF="${{ inputs.tag }}"
          if [ -z "$REF" ]; then REF="dev"; fi
          VER="${REF#v}"
          PKG="SourceLook-$VER"
          mkdir -p "dist/$PKG"
          cp index.js client.js icon.svg cordis.patch.yml package.json LICENSE NOTICE README.md README.en.md "dist/$PKG/"
          cp -r host renderer-lib vendor locale "dist/$PKG/"
          cd dist
          # runner 上没有 zip 命令，用 python3 的 zipfile（Ubuntu 必带）。
          python3 -m zipfile -c "$PKG.zip" "$PKG"
          ls -lh "$PKG.zip"

      - name: Create release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
